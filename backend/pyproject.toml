[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "buying-house-platform"
version = "0.1.0"
description = "Two-sided buying-house platform: brands, suppliers, and the internal merchandising console"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "email-validator>=2.1",
    "sqlalchemy>=2.0.29",
    "alembic>=1.13",
    "psycopg[binary]>=3.1",
    "pgvector>=0.2.5",
    "pyjwt>=2.8",
    "argon2-cffi>=23.1",
    # Verifies Google ID tokens — signature against Google's published keys, audience, issuer,
    # expiry. Hand-rolling that is how sign-in bugs happen.
    "google-auth>=2.29",
    "requests>=2.31",
    "celery>=5.3",
    "redis>=5.0",
    "boto3>=1.34",
    "python-multipart>=0.0.9",
    "openpyxl>=3.1",
    "sqlglot>=25.0",
    # Retrieval layer. pgvector-python maps the vector column; pymupdf pulls text out of PDFs.
    "pgvector>=0.3",
    "pymupdf>=1.24",
    # Chatbot. LangGraph for the classifier-then-branch topology; langchain-anthropic for the
    # model binding. Deliberately not langchain-community — see app/retrieval/search.py.
    "langgraph>=0.2",
    "langchain-core>=0.3",
    "langchain-anthropic>=0.3",
    # Optional: only imported when nlsql_backend=claude. The stub planner needs nothing.
    "anthropic>=0.49",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.1",
    "httpx>=0.27",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
