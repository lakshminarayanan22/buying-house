services:
  db:
    image: pgvector/pgvector:pg15
    environment:
      POSTGRES_USER: bh
      POSTGRES_PASSWORD: bh
      POSTGRES_DB: buyinghouse
    ports: ["5432:5432"]
    volumes: ["bh_pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bh -d buyinghouse"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports: ["9000:9000", "9001:9001"]
    volumes: ["bh_miniodata:/data"]

volumes:
  bh_pgdata:
  bh_miniodata:
